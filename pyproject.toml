[project]
name = "ai-security-api"
version = "2.0.0"
description = "A secure, AI-powered enterprise REST API demonstrating production-grade LLM security patterns."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# `extend-exclude`, not `exclude`: the latter REPLACES ruff's built-in default
# excludes (.venv, venv, build, dist, ...), so a virtualenv created inside the
# repo would get linted as project source.
# The two entries here are standalone PDF generators, not part of the
# application or its tests.
extend-exclude = ["generate_demo_script.py", "generate_study_guide.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Test and red-team files legitimately contain hardcoded credentials and asserts.
"tests/*" = ["S101", "S105", "S106"]
"redteam/*" = ["S101", "S105", "S106"]
"evals/*" = ["S101"]
# The in-memory demo key store is intentionally hardcoded; documented in README.
"app/security/keystore.py" = ["S105", "S106"]
# Detection patterns necessarily contain secret-shaped strings ("password",
# "api key"). They are regexes to match on, not credentials.
"app/security/injection.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "redteam", "evals", ".venv", "scripts"]
