# Local development stack.
#
#   docker compose up --build
#   open http://localhost:8000
#
# Defaults to mock mode so it runs with no API key and no cost. To exercise the
# real Gemini path, put GEMINI_API_KEY in .env and set LLM_MODE=live.

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      LLM_DAILY_CALL_BUDGET: ${LLM_DAILY_CALL_BUDGET:-500}
      RATE_LIMIT: ${RATE_LIMIT:-10/minute}
      # Compose publishes the port directly, so there is no trusted proxy in
      # front of the app and X-Forwarded-For must not be believed.
      TRUST_PROXY_HEADERS: "false"
      AUDIT_LOG_PATH: /app/data/audit.log
    volumes:
      - audit-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Defence in depth: the process needs no privileges and writes only to the
    # audit volume.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

volumes:
  audit-data:
